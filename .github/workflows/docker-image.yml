name: Build Backend Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      # Checkout with full history (needed for versioning)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Generate version
      - name: Get Custom Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"

      # Setup Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & push
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/backend:staging \
            -t ghcr.io/${{ github.repository }}/backend:${{ steps.semver.outputs.version }} \
            ./Backend/Backend

          docker push ghcr.io/${{ github.repository }}/backend --all-tags

      # Create release
      - name: Create release notes
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.semver.outputs.version }}
          generateReleaseNotes: true
