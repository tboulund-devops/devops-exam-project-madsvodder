name: Build Backend Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mutation-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend/Backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x" # adjust to your target framework

      - name: Install Stryker
        run: dotnet tool install -g dotnet-stryker

      - name: Run Stryker
        run: dotnet stryker --reporter json --reporter html --threshold-low
        # --threshold-break makes the step fail if mutation score drops below 70%

      - name: Upload Stryker report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: |
            ./Backend/Backend/StrykerOutput/**/mutation-report.html
            ./Backend/Backend/StrykerOutput/**/mutation-report.json

  build:
    runs-on: ubuntu-latest
    needs: mutation-test # ← remove this line if you want build to ignore test failures

    permissions:
      contents: write
      packages: write

    steps:
      # Checkout with full history (needed for versioning)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Generate version
      - name: Get Custom Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: ""
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"

      # Setup Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & push
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/frontend:staging \
            -t ghcr.io/${{ github.repository }}/frontend:${{ steps.semver.outputs.version }} \
            ./Frontend

          docker build \
            -t ghcr.io/${{ github.repository }}/backend:staging \
            -t ghcr.io/${{ github.repository }}/backend:${{ steps.semver.outputs.version }} \
            ./Backend/Backend

          docker push ghcr.io/${{ github.repository }}/frontend --all-tags
          docker push ghcr.io/${{ github.repository }}/backend --all-tags

      - name: Create release notes
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.semver.outputs.version }}
          generateReleaseNotes: true

      - name: Deliver docker compose file to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.STAGING_SERVER_IP }}
          username: ${{ vars.STAGING_SERVER_USERNAME }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          source: "docker-compose.yaml"
          target: dowa/

      - name: Run docker compose on the staging server
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ vars.STAGING_SERVER_IP }}
          username: ${{ vars.STAGING_SERVER_USERNAME }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          script: |
            cd dowa
            docker compose pull
            docker compose up -d

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/loadsite-rate.js
        env:
          BASE_URL: ${{ vars.FRONTEND_STAGING_URL }}

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: results.json
