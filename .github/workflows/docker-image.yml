name: Build Backend Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout - No idea what this does
      - name: Checkout repository
        uses: actions/checkout@v4

        # 1. Checkout med fuld historik
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Beregn versionen
      - name: Get Custom Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          # Indstillinger
          tag_prefix: "v"
          major_pattern: "(MAJOR)" # Hvad kigger den efter for major bumps
          minor_pattern: "(MINOR)" # Hvad kigger den efter for minor bumps
          version_format: "${major}.${minor}.${patch}"

        # Docker buildx - No idea what this does
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

        # Log in to the github container registry
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

        # Build the docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/backend:staging \
            -t ghcr.io/${{ github.repository }}:${{ steps.semver-app.outputs.version }} \
            ./Backend/Backend
            .
          docker push ghcr.io/${{ github.repository }} --all-tags

      # Create release notes
      - name: Create release notes
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.semver-app.outputs.version }}
          generateReleaseNotes: true
          body: |
            This release inclused the following container image:
              http://ghcr.io/${{ github.repository }}:${{ steps.semver-app.outputs.version }}
