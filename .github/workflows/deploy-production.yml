name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build Backend Docker Image"] # must match your staging workflow name exactly
    types:
      - completed
    branches:
      - main

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    # Only run if staging workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    environment: production # ← pauses here and waits for your approval

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deliver docker compose file to production
      - name: Deliver docker compose file to production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.PROD_SERVER_IP }}
          username: ${{ vars.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          source: "docker-compose.prod.yaml"
          target: dowa/

      # Run docker compose on the production server
      - name: Run docker compose on the production server
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ vars.PROD_SERVER_IP }}
          username: ${{ vars.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd dowa
            docker compose -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.prod.yaml up -d
