<div class="all">
  <div class="search-bar">
    <input
      type="text"
      placeholder="Search movies..."
      [(ngModel)]="searchQuery"
      (ngModelChange)="onSearch()"
    />
  </div>
  <div class="grid">
    @if (movies$ | async; as movies) {
      @for (movie of movies$ | async; track movie.id) {
        <app-movie-card [movie]="movie"></app-movie-card>
      }
    } @else {
      <p>Loading movies...</p>
    }
  </div>
</div>
