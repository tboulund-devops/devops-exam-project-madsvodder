<div class="navbar">
  <ul>
    <li><a routerLink="">Home</a></li>
    <li><a routerLink="top">Top movies</a></li>
    <li><a routerLink="/movies/create">Create new movie</a></li>

    <li class="welcome">
      @if (getUsername()) {
        <b>Welcome {{ getUsername() }}</b>
        <button (click)="logOut()">Sign out</button>
      } @else {
        @if (loginEnabled) {
          <a routerLink="login">Login</a>
        }
      }
    </li>
  </ul>
</div>
