<div class="card">
  <div class="poster-container">
    <img
      [src]="movie()?.posterUrl"
      alt="poster"
    />
  </div>

  <div class="container">
    <h4>
      <b>{{ movie()?.title }}</b>
    </h4>

    <p>Rating: {{ displayRating() }}</p>

    @if (canRate()) {
      <div class="stars">
        @for (star of [5, 4, 3, 2, 1]; track star) {
          <span
            (click)="rate(star)"
            [class.filled]="star <= displayRatingNumber()"
          >
            ★
          </span>
        }
      </div>
    }
  </div>
</div>
