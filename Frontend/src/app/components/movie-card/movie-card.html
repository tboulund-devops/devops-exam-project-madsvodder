<div class="card">
  <img
    src="https://m.media-amazon.com/images/M/MV5BNjI3NDE2ODkzN15BMl5BanBnXkFtZTgwMzg0OTk1MDE@._V1_FMjpg_UX1000_.jpg"
    alt="poster"
    style="width: 100%"
  />
  <div class="container">
    <h4>
      <b>{{ movie()?.title }}</b>
    </h4>
    <p>Rating: {{ movie()?.rating }}</p>
    <input
      type="range"
      min="1"
      max="10"
      #ratingInput
      (input)="sendRatingRequest(ratingInput.value)"
    />
  </div>
</div>
