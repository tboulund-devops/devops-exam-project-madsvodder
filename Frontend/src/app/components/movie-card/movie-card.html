<div class="card">
  <img
    src="https://m.media-amazon.com/images/M/MV5BNjI3NDE2ODkzN15BMl5BanBnXkFtZTgwMzg0OTk1MDE@._V1_FMjpg_UX1000_.jpg"
    alt="poster"
    style="width: 100%"
  />

  <div class="container">
    <h4>
      <b>{{ movie()?.title }}</b>
    </h4>

    <p>Rating: {{ displayRating() }}</p>

    @if (canRate()) {
      <div class="stars">
        @for (star of [5, 4, 3, 2, 1]; track star) {
          <span
            (click)="rate(star)"
            [class.filled]="star <= displayRatingNumber()"
          >
    ★
  </span>
        }
      </div>
    }
  </div>
</div>
