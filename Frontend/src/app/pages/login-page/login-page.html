<div>
  <form (ngSubmit)="loginUser()">
    <label for="email">Email</label>
    <br>
    <input type="email" id="email" name="email" [formControl]="email">
    <br>
    <label for="password">Password</label>
    <br>
    <input type="password" id="password" name="password" [formControl]="password">
    <br>
    <input type="submit" value="Submit">
  </form>

  <button routerLink="/register">Register?</button>
</div>
